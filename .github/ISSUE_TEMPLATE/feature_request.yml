name: Feature request
description: Suggest something the mod could do for keeping track of pull requests
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or missing when you keep track of pull requests today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you'd like the mod to help. Mock-ups and examples welcome.
    validations:
      required: true
